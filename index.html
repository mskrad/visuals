function rnd(n){ return Math.floor(Math.random()*n); }
function icon(ctx, i, tint, x, y, size, rot, alpha){
  const f = FRAMES[((i%NICON)+NICON)%NICON];
  const ti = ((tint%TN)+TN)%TN;
  const a = alpha === undefined ? 1 : alpha;
  const sc = size / Math.max(f.w, f.h);
  ctx.save();
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  if (size >= MIN*0.1 && glows.length){
    // мягкое свечение под крупными иконками
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = a*0.45;
    const gw = f.w*sc*1.4, gh = f.h*sc*1.4;
    ctx.drawImage(glows[ti], f.x*GS, f.y*GS, f.w*GS, f.h*GS, -gw/2, -gh/2, gw, gh);
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.globalAlpha = a;
  ctx.drawImage(tints[ti], f.x, f.y, f.w, f.h,
    -f.w*sc/2, -f.h*sc/2, f.w*sc, f.h*sc);
  ctx.restore();
}

// ---------- state ----------
let bpm = 128, speed = 1, sceneIdx = 0;
let prevIdx = -1, transStart = -1;
const TRANS_MS = 1000;

const flash = document.getElementById('flash');
let flashTimeout;
function flashMsg(msg){
  flash.textContent = msg;
  flash.classList.add('show');
  clearTimeout(flashTimeout);
  flashTimeout = setTimeout(()=>flash.classList.remove('show'), 2000);
}

// ---------- beat clock ----------
let beatStart = performance.now(), beatBump = 0;
function beatPhase(t){ const m = 60000/bpm; return ((t-beatStart)%m)/m; }
function beatPulse(t){ return Math.pow(1-beatPhase(t), 3)*0.6; }
function beatCount(t){ return Math.floor((t-beatStart)/(60000/bpm)) + beatBump; }

let taps = [];
function tap(){
  const now = performance.now();
  taps = taps.filter(x => now-x < 3000);
  taps.push(now);
  beatBump += Math.floor((now-beatStart)/(60000/bpm)) + 1;
  beatStart = now;
  if (taps.length >= 3){
    const iv = [];
    for (let i=1;i<taps.length;i++) iv.push(taps[i]-taps[i-1]);
    const avg = iv.reduce((a,b)=>a+b)/iv.length;
    bpm = Math.max(60, Math.min(200, Math.round(60000/avg)));
  }
  flashMsg('TAP · ' + bpm + ' BPM');
}

// ---------- mic ----------
let micOn=false, audioCtx=null, analyser=null, freqData=null, micStream=null;
const energyHist=[]; let lastOnset=0; const onsetTimes=[];
async function startMic(){
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false }
    });
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.3;
    audioCtx.createMediaStreamSource(micStream).connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    micOn = true; flashMsg('🎤 MIC ON');
  } catch(e){ flashMsg('🎤 НЕТ ДОСТУПА'); }
}
function stopMic(){
  micOn=false;
  if (micStream) micStream.getTracks().forEach(tr=>tr.stop());
  if (audioCtx) audioCtx.close();
  audioCtx=analyser=micStream=null;
  energyHist.length=0; onsetTimes.length=0;
  flashMsg('🎤 MIC OFF');
}
function onMicBeat(now){
  beatBump += Math.floor((now-beatStart)/(60000/bpm)) + 1;
  beatStart = now;
  onsetTimes.push(now);
  if (onsetTimes.length>12) onsetTimes.shift();
  const iv=[];
  for (let i=1;i<onsetTimes.length;i++){
    const v = onsetTimes[i]-onsetTimes[i-1];
    if (v>240 && v<1500) iv.push(v);
  }
  if (iv.length>=4){
    iv.sort((a,b)=>a-b);
    let est = 60000/iv[Math.floor(iv.length/2)];
    while (est>180) est/=2;
    while (est<70) est*=2;
    bpm = Math.round(bpm*0.7 + est*0.3);
  }
}
function micAnalyse(now){
  if (!micOn||!analyser) return;
  analyser.getByteFrequencyData(freqData);
  let bass=0;
  for (let i=1;i<=7;i++) bass+=freqData[i];
  bass/=7;
  energyHist.push(bass);
  if (energyHist.length>45) energyHist.shift();
  if (energyHist.length<20) return;
  const mean = energyHist.reduce((a,b)=>a+b)/energyHist.length;
  const varc = energyHist.reduce((a,b)=>a+(b-mean)**2,0)/energyHist.length;
  const thr = mean*(1.3+Math.min(0.3,varc/4000))+8;
  if (bass>thr && bass>30 && now-lastOnset>300){
    lastOnset=now; onMicBeat(now);
  }
}

// ---------- 5 струн: разбор входящего сигнала на полосы ----------
// Струна = полоса спектра по лог-шкале: бас, низ, середина, верх, воздух.
// По каждой полосе держим:
//   strLvl   — уровень с авто-усилением (без него верхние струны всегда молчат);
//   strNote  — где внутри полосы сидит доминирующая частота, 0..1. Это «нота»:
//              из неё берётся число пучностей, поэтому струна отыгрывает мелодию,
//              а не просто дёргается на громкость;
//   strPluck — огибающая щипка по атаке в полосе;
//   strPhase — фаза дрожания, тем быстрее, чем выше нота;
//   strHits  — счётчик щипков, по нему сцена сыплет искры.
const NSTR = 5;
const STR_HZ = [30, 110, 320, 900, 2600, 9000];
const STR_COL = [0, 3, 2, 1, 4];        // индексы в NEON: бас красный … воздух фиолетовый
const strLvl     = new Float32Array(NSTR);
const strNote    = new Float32Array(NSTR).fill(0.5);
const strPluck   = new Float32Array(NSTR);
const strPhase   = new Float32Array(NSTR);
const strHits    = new Int32Array(NSTR);
const strRef     = new Float32Array(NSTR).fill(0.05);  // скользящий максимум полосы
const strAvg     = new Float32Array(NSTR);             // медленное среднее — порог атаки
const strLastHit = new Float32Array(NSTR);
let strBeat = -1;

function pluck(s, t){ strPluck[s]=1; strLastHit[s]=t; strHits[s]++; }

function stringsAnalyse(t, dt){
  const kd = Math.min(1, dt/1000);
  if (micOn && analyser && freqData){
    const nyq = audioCtx.sampleRate/2, bins = freqData.length;
    for (let s=0;s<NSTR;s++){
      const lo = Math.max(1, Math.round(STR_HZ[s]/nyq*bins));
      const hi = Math.max(lo+1, Math.min(bins-1, Math.round(STR_HZ[s+1]/nyq*bins)));
      let sum=0, bi=lo, bv=-1;
      for (let i=lo;i<=hi;i++){
        const v=freqData[i]; sum+=v;
        if (v>bv){ bv=v; bi=i; }
      }
      const e = sum/((hi-lo+1)*255);
      // максимум полосы быстро растёт и медленно тает (~2.5 с) — это и есть авто-усиление
      strRef[s] = Math.max(e, strRef[s]*(1-kd*0.4));
      const lvl = Math.min(1, e/Math.max(0.03, strRef[s]));
      strLvl[s] += (lvl-strLvl[s])*Math.min(1, dt/60);
      if (bv>12) strNote[s] += (Math.log(bi/lo)/Math.log(hi/lo) - strNote[s])*Math.min(1, dt/180);
      strAvg[s] += (lvl-strAvg[s])*Math.min(1, dt/420);
      if (lvl>strAvg[s]+0.16 && lvl>0.3 && t-strLastHit[s]>110) pluck(s, t);
    }
  } else {
    // без микрофона струны отыгрывают тактовый генератор: бас на каждую долю,
    // остальные — по рисунку на 8 долей, чтобы было что слушать глазами
    const bc = beatCount(t), p = beatPulse(t);
    const pat = [0,2,1,4,0,3,1,2];
    const lead = pat[((bc%8)+8)%8];
    if (bc!==strBeat){
      strBeat = bc;
      pluck(0, t);
      if (lead!==0) pluck(lead, t);
    }
    for (let s=0;s<NSTR;s++){
      const on = (s===0 || lead===s);
      const target = on ? 0.3+p*0.7 : 0.12+p*0.1;
      strLvl[s] += (target-strLvl[s])*Math.min(1, dt/70);
      strNote[s] += ((0.5+0.42*Math.sin(bc*0.7+s*1.9)) - strNote[s])*Math.min(1, dt/220);
    }
  }
  for (let s=0;s<NSTR;s++){
    strPluck[s] *= Math.exp(-dt/280);
    strPhase[s] = (strPhase[s] + dt*0.001*2*Math.PI*(2.4+(1+strNote[s]*4)*1.15)) % (Math.PI*2);
  }
}

// ================= 20 СЦЕН =================


// Сцены. Контракт: S(name, init, draw).
//   init(): вызывается при каждом входе в сцену и при resize. Здесь — начальное состояние.
//   draw(ctx, t, dt): ctx — ПЕРСОНАЛЬНЫЙ канвас сцены, не главный.
//     Полная заливка '#000' — кадр без следов; заливка 'rgba(0,0,0,0.2)' — со шлейфом.
// Доступно из ядра: W H CX CY MIN, beatPulse(t) beatCount(t) beatPhase(t),
//   icon(ctx,i,tint,x,y,size,rot,alpha), NEON MONO mrnd() rnd(n) NICON, speed.
// Порядок массива scenes = порядок листания, он же рейтинг: лучшее в начале.
// S(name, init, draw) — фабрика
function S(name, init, draw){ return { name, init, draw }; }

// 4. ZOOM TUNNEL — иконки летят на зрителя
const zoomT = S('ZOOM TUNNEL',
  function(){ this.d=[]; for(let i=0;i<40;i++) this.d.push(this.mk(Math.random()*900+100)); },
  function(ctx,t,dt){
    ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(0,0,W,H);
    const p=beatPulse(t);
    this.d.sort((a,b)=>b.z-a.z);
    for(const o of this.d){
      o.z -= dt*(0.25+p*0.5)*speed;
      if (o.z<=20) Object.assign(o, this.mk(1000));
      const k=340/o.z;
      const x=CX+o.dx*k, y=CY+o.dy*k;
      if (x<-150||x>W+150||y<-150||y>H+150){ Object.assign(o,this.mk(1000)); continue; }
      icon(ctx,o.i,o.c,x,y,MIN*0.22*k*0.42,o.r+t*0.0003,Math.min(1,(1000-o.z)/150));
    }
  });
zoomT.mk = function(z){
  const a=Math.random()*Math.PI*2, r=40+Math.random()*260;
  return { dx:Math.cos(a)*r, dy:Math.sin(a)*r, z, i:rnd(NICON), c:mrnd(), r:Math.random()*6 };
};

// 5. DISCO GRID — сетка, зажигается на бит
const grid = S('DISCO GRID',
  function(){ this.lastB=-1; this.lit=new Set(); },
  function(ctx,t){
    const cols=8, rows=5;
    const bc=beatCount(t);
    if (bc!==this.lastB){
      this.lastB=bc; this.lit.clear();
      const n=8+rnd(10);
      for(let i=0;i<n;i++) this.lit.add(rnd(cols*rows));
    }
    ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
    const p=beatPulse(t);
    const cw=W/cols, chh=H/rows;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const idx=r*cols+c;
      const on=this.lit.has(idx);
      const s=Math.min(cw,chh)*(on?0.62+p*0.28:0.4);
      icon(ctx,(idx+bc)%NICON, on?(idx+bc)%6:6,
        c*cw+cw/2, r*chh+chh/2, s, 0, on?1:0.16);
    }
  });

// 8. KALEIDO — калейдоскоп из спрайтов
const kaleido = S('KALEIDO',
  function(){
    this.segs=10;
    this.wedge=Math.PI/this.segs;
    this.d=[];
    // блобы живут ВНУТРИ исходного сектора — иначе зеркала показывают пустоту
    for(let i=0;i<9;i++) this.d.push({
      a:(Math.random()*1.6-0.8)*this.wedge,
      r:MIN*0.09+Math.random()*MIN*0.36,
      va:(Math.random()-0.5)*0.0012, vr:(Math.random()-0.5)*0.05,
      i:rnd(NICON), c:mrnd(), s:MIN*0.1+Math.random()*MIN*0.05,
      rot:Math.random()*6, vrot:(Math.random()-0.5)*0.004
    });
    this.buf=document.createElement('canvas'); this.bctx=this.buf.getContext('2d');
  },
  function(ctx,t,dt){
    if (this.buf.width!==W){ this.buf.width=W; this.buf.height=H; }
    const b=this.bctx, p=beatPulse(t);
    b.fillStyle='rgba(0,0,0,0.1)'; b.fillRect(0,0,W,H);
    const wd=this.wedge;
    for(const o of this.d){
      o.a+=o.va*dt*speed; o.r+=o.vr*dt*speed; o.rot+=o.vrot*dt;
      if (o.a<-wd*0.85||o.a>wd*0.85) o.va*=-1;
      if (o.r<MIN*0.07||o.r>MIN*0.46) o.vr*=-1;
      icon(b,o.i,o.c,CX+Math.cos(o.a)*o.r,CY+Math.sin(o.a)*o.r,o.s*(1+p*0.5),o.rot,1);
    }
    ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
    const segs=this.segs, R=Math.hypot(W,H);
    for(let i=0;i<segs;i++){
      ctx.save();
      ctx.translate(CX,CY);
      ctx.rotate(i*Math.PI*2/segs + t*0.00015*speed);
      if (i%2) ctx.scale(1,-1);
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.arc(0,0,R,-Math.PI/segs,Math.PI/segs); ctx.closePath(); ctx.clip();
      ctx.drawImage(this.buf,-CX,-CY);
      ctx.restore();
    }
  });

// 9. MEGA PULSE — гигантская иконка + ударная волна
const mega = S('MEGA PULSE',
  function(){ this.lastB=-1; this.i=0; this.c=0; this.rings=[]; },
  function(ctx,t,dt){
    const bc=beatCount(t);
    if (bc!==this.lastB){
      this.lastB=bc; this.i=rnd(NICON); this.c=rnd(6);
      this.rings.push({r:MIN*0.1, a:1});
    }
    ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(0,0,W,H);
    const p=beatPulse(t);
    for(let i=this.rings.length-1;i>=0;i--){
      const rg=this.rings[i];
      rg.r+=dt*0.5*speed; rg.a-=dt*0.0012;
      if (rg.a<=0){ this.rings.splice(i,1); continue; }
      ctx.strokeStyle=NEON[this.c]; ctx.globalAlpha=rg.a; ctx.lineWidth=3+p*6;
      ctx.beginPath(); ctx.arc(CX,CY,rg.r,0,Math.PI*2); ctx.stroke();
    }
    ctx.globalAlpha=1;
    icon(ctx,this.i,this.c,CX,CY,MIN*(0.3+p*0.22), Math.sin(t*0.001)*0.1, 1);
  });

// 12. STROBE ICON — стробоскоп
const strobe = S('STROBE ICON',
  function(){ this.lastK=-1; this.i=0; this.c=0; this.bg=0; },
  function(ctx,t){
    const bc=beatCount(t);
    const k=bc;
    if (k!==this.lastK){
      this.lastK=k; this.i=rnd(NICON); this.c=6;
      this.bg=(bc%8===0)?1:0;
    }
    const p=beatPulse(t);
    if (this.bg && p>0.45){ ctx.fillStyle='#fff'; }
    else ctx.fillStyle='#000';
    ctx.fillRect(0,0,W,H);
    icon(ctx,this.i,this.c,CX,CY,
      MIN*(0.4+p*0.3), (k%4-1.5)*0.08, 0.7+p*0.3);
  });

// 14. ICON MATRIX — матричные колонки
const matrix = S('ICON MATRIX',
  function(){
    const cols=Math.ceil(W/(MIN*0.09));
    this.cols=[];
    for(let c=0;c<cols;c++) this.cols.push({
      y:Math.random()*H, v:0.4+Math.random()*1.6, i:rnd(NICON), c:mrnd()
    });
  },
  function(ctx,t,dt){
    ctx.fillStyle='rgba(0,0,0,0.22)'; ctx.fillRect(0,0,W,H);
    const p=beatPulse(t), sz=MIN*0.075;
    const step=W/this.cols.length;
    this.cols.forEach((col,ci)=>{
      col.y += col.v*dt*0.12*speed*(1+p*0.4);
      if (col.y>H+sz*5){ col.y=-sz*5; col.i=rnd(NICON); col.c=mrnd(); col.v=0.4+Math.random()*1.6; }
      for(let k=0;k<5;k++){
        icon(ctx,(col.i+k)%NICON, k===0?6:col.c,
          ci*step+step/2, col.y-k*sz*1.15, sz*(1+ (k===0?p*0.4:0)), 0, 1-k*0.2);
      }
    });
  });

// 15. WARP FIELD — варп из иконок
const warp = S('WARP FIELD',
  function(){ this.d=[]; for(let i=0;i<210;i++) this.d.push(this.mk(Math.random()*1000)); },
  function(ctx,t,dt){
    ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(0,0,W,H);
    const p=beatPulse(t);
    for(const o of this.d){
      o.z -= dt*(0.35+p*0.7)*speed;
      if (o.z<=1){ Object.assign(o,this.mk(1000)); continue; }
      const k=300/o.z;
      const x=CX+o.x*k, y=CY+o.y*k;
      if (x<-80||x>W+80||y<-80||y>H+80){ Object.assign(o,this.mk(1000)); continue; }
      icon(ctx,o.i,o.c,x,y,Math.max(2,MIN*0.11*k*0.36),0,Math.min(1,(1000-o.z)/130));
    }
  });
warp.mk=function(z){
  return { x:(Math.random()-0.5)*W, y:(Math.random()-0.5)*H, z,
    i:rnd(NICON), c:MONO[rnd(2)] };
};

// 16. RING WAVES — кольца из иконок на бит
const rings = S('RING WAVES',
  function(){ this.rings=[]; this.lastB=-1; },
  function(ctx,t,dt){
    ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(0,0,W,H);
    const bc=beatCount(t);
    if (bc!==this.lastB){
      this.lastB=bc;
      this.rings.push({ r:MIN*0.05, i:rnd(NICON), c:mrnd(), n:8+rnd(8), a:1, rot:Math.random()*6 });
    }
    const p=beatPulse(t);
    for(let j=this.rings.length-1;j>=0;j--){
      const rg=this.rings[j];
      rg.r += dt*0.28*speed; rg.a -= dt*0.00065; rg.rot += dt*0.0004;
      if (rg.a<=0 || rg.r>Math.hypot(W,H)/1.6){ this.rings.splice(j,1); continue; }
      for(let k=0;k<rg.n;k++){
        const a=k/rg.n*Math.PI*2+rg.rot;
        icon(ctx,rg.i,rg.c,CX+Math.cos(a)*rg.r,CY+Math.sin(a)*rg.r,
          MIN*0.09*(1+p*0.3), a+Math.PI/2, Math.max(0,rg.a));
      }
    }
    icon(ctx, bc%NICON, 6, CX, CY, MIN*0.14*(1+p*0.5), 0, 1);
  });

// 17. FLOOR — перспективный пол
const floor = S('PERSPECTIVE FLOOR',
  function(){ this.off=0; },
  function(ctx,t,dt){
    ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
    const p=beatPulse(t);
    this.off += dt*0.0006*speed*(1+p);
    const horizon=H*0.35, rowsN=14, colsN=9;
    for(let r=rowsN;r>=1;r--){
      const z=(r - (this.off%1))/rowsN;         // 0 близко..1 далеко
      const y=horizon + (H-horizon)*Math.pow(1-z,1.7);
      const sc=Math.pow(1-z,1.6);
      const rowIdx=Math.floor(this.off)+r;
      for(let c=0;c<colsN;c++){
        const spread=(c-(colsN-1)/2)/((colsN-1)/2);
        const x=CX + spread*W*0.75*(0.15+sc*0.85);
        icon(ctx,(rowIdx*3+c)%NICON,(rowIdx+c)%6,x,y,
          MIN*0.16*sc*(1+p*0.25),0,Math.min(1,sc*2.5));
      }
    }
  });

// 19. FIREWORKS — фейерверки
const fireworks = S('FIREWORKS',
  function(){ this.rockets=[]; this.sparks=[]; this.lastB=-1; },
  function(ctx,t,dt){
    ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.fillRect(0,0,W,H);
    const bc=beatCount(t);
    if (bc!==this.lastB){
      this.lastB=bc;
      this.rockets.push({ x:W*0.15+Math.random()*W*0.7, y:H+20,
        vy:-(0.55+Math.random()*0.3), ty:H*0.15+Math.random()*H*0.35,
        i:rnd(NICON), c:rnd(6) });
    }
    for(let j=this.rockets.length-1;j>=0;j--){
      const r=this.rockets[j];
      r.y += r.vy*dt*speed;
      icon(ctx,r.i,6,r.x,r.y,MIN*0.045,0,1);
      if (r.y<=r.ty){
        this.rockets.splice(j,1);
        for(let k=0;k<32;k++){
          const a=Math.random()*Math.PI*2, sp=1+Math.random()*4;
          this.sparks.push({ x:r.x,y:r.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
            life:1,i:r.i,c:r.c,s:MIN*0.05+Math.random()*MIN*0.06,rot:Math.random()*6 });
        }
      }
    }
    const p=beatPulse(t);
    for(let j=this.sparks.length-1;j>=0;j--){
      const s=this.sparks[j];
      s.x+=s.vx*dt*0.06*speed; s.y+=s.vy*dt*0.06*speed;
      s.vy+=0.0018*dt; s.vx*=0.995; s.vy*=0.995; s.life-=dt*0.00035;
      if (s.life<=0){ this.sparks.splice(j,1); continue; }
      icon(ctx,s.i,s.c,s.x,s.y,s.s*(1+p*0.2),s.rot,Math.max(0,s.life));
    }
  });

// 21. PLASMA — классическая демосценовая плазма
function hsl(h,s,l){
  h=((h%360)+360)%360; s/=100; l/=100;
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  let r,g,b;
  if(h<60)[r,g,b]=[c,x,0]; else if(h<120)[r,g,b]=[x,c,0];
  else if(h<180)[r,g,b]=[0,c,x]; else if(h<240)[r,g,b]=[0,x,c];
  else if(h<300)[r,g,b]=[x,0,c]; else [r,g,b]=[c,0,x];
  return [(r+m)*255,(g+m)*255,(b+m)*255];
}
const plasma = S('PLASMA',
  function(){
    this.PW=160; this.PH=90;
    this.buf=document.createElement('canvas');
    this.buf.width=this.PW; this.buf.height=this.PH;
    this.bctx=this.buf.getContext('2d');
    this.img=this.bctx.createImageData(this.PW,this.PH);
  },
  function(ctx,t){
    const d=this.img.data, tt=t*0.0012*speed, pulse=beatPulse(t);
    const {PW,PH}=this;
    for(let y=0;y<PH;y++){
      for(let x=0;x<PW;x++){

          Math.sin(y*0.11-tt*1.3) +
          Math.sin((x+y)*0.07+tt*0.7) +
          Math.sin(Math.hypot(x-PW/2,y-PH/2)*0.12-tt*2);
        const [r,g,b]=hsl((v*40+tt*40)%360,100,45+pulse*25);
        const idx=(y*PW+x)*4;
        d[idx]=r; d[idx+1]=g; d[idx+2]=b; d[idx+3]=255;
      }
    }
    this.bctx.putImageData(this.img,0,0);
    ctx.imageSmoothingEnabled=true;
    ctx.drawImage(this.buf,0,0,W,H);
  });

// N4. RIPPLE GRID — волны по сетке от каждого бита (цвет)
const ripple = S('RIPPLE GRID',
  function(){ this.waves=[]; this.lastB=-1; },
  function(ctx,t,dt){
    ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
    const bc=beatCount(t);
    if (bc!==this.lastB){ this.lastB=bc; this.waves.push({r:0,c:rnd(6)}); }
    const maxR=Math.hypot(CX,CY)+150;
    for(let j=this.waves.length-1;j>=0;j--){
      this.waves[j].r+=dt*0.45*speed;
      if (this.waves[j].r>maxR) this.waves.splice(j,1);
    }
    const cols=10, rows=6;
    const cw=W/cols, chh=H/rows;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const x=c*cw+cw/2, y=r*chh+chh/2;
      const d=Math.hypot(x-CX,y-CY);
      let e=0, col=6;
      for(const w of this.waves){
        const g=Math.exp(-Math.pow((d-w.r)/70,2));
        if (g>e){ e=g; col=w.c; }
      }
      e=Math.min(1.15,e);
      icon(ctx,(r*cols+c)%NICON, e>0.2?col:6, x, y,
        Math.min(cw,chh)*(0.32+e*0.5), 0, 0.12+e*0.88);
    }
  });

// N5. SYNTH HORIZON — синтвейв-горизонт (цвет)
const horizon = S('SYNTH HORIZON',
  function(){ this.off=0; this.stars=[]; 
    for(let i=0;i<60;i++) this.stars.push({x:Math.random(),y:Math.random()*0.4,s:Math.random()});
  },
  function(ctx,t,dt){
    const p=beatPulse(t), bc=beatCount(t);
    const hy=H*0.48;
    // небо
    const sky=ctx.createLinearGradient(0,0,0,hy);
    sky.addColorStop(0,'#05000f');
    sky.addColorStop(1,'#2a0033');
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,hy);
    ctx.fillStyle='#000'; ctx.fillRect(0,hy,W,H-hy);
    // звёзды
    for(const s of this.stars){
      ctx.fillStyle='rgba(255,255,255,'+(0.25+s.s*0.5)+')';
      ctx.fillRect(s.x*W,s.y*H,2,2);
    }
    // солнце-иконка
    icon(ctx, Math.floor(bc/8)%NICON, 0, CX, hy-MIN*0.13, MIN*0.34*(1+p*0.12), 0, 1);
    // сетка: вертикали в точку схода
    this.off+=dt*0.0009*speed*(1+p*0.4);
    ctx.strokeStyle=NEON[1];
    ctx.lineWidth=1.5;
    for(let i=-10;i<=10;i++){
      ctx.globalAlpha=0.55;
      ctx.beginPath();
      ctx.moveTo(CX+i*W*0.011,hy);
      ctx.lineTo(CX+i*W*0.26,H+40);
      ctx.stroke();
    }
    // горизонтали, едущие на зрителя
    for(let k=0;k<14;k++){
      const z=((k - this.off%1)/14+1)%1;
      const y=hy+(H-hy)*Math.pow(1-z,2.2);
      ctx.globalAlpha=0.15+(1-z)*0.6;
      ctx.lineWidth=1+(1-z)*2.5;
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    }
    ctx.globalAlpha=1;
    // линия горизонта светится в бит
    ctx.strokeStyle=NEON[0]; ctx.lineWidth=2+p*4;
    ctx.beginPath(); ctx.moveTo(0,hy); ctx.lineTo(W,hy); ctx.stroke();
  });

// N9. POLY MORPH — морфящий неоновый многоугольник (цвет)
const poly = S('POLY MORPH',
  function(){ this.nf=3; this.target=3; this.lastB=-1; },
  function(ctx,t,dt){
    ctx.fillStyle='rgba(0,0,0,0.1)'; ctx.fillRect(0,0,W,H);
    const p=beatPulse(t), bc=beatCount(t);
    if (bc!==this.lastB && bc%2===0){
      this.lastB=bc;
      this.target=3+rnd(6);
    }
    this.nf += (this.target-this.nf)*Math.min(1,dt*0.004);
    const col=NEON[Math.floor(bc/2)%6];
    ctx.save();
    ctx.translate(CX,CY);
    ctx.rotate(t*0.0005*speed);
    ctx.strokeStyle=col;
    ctx.shadowColor=col; ctx.shadowBlur=25+p*30;
    ctx.lineWidth=4+p*8;
    ctx.beginPath();
    const R=MIN*0.3*(1+p*0.15), steps=120;
    for(let i=0;i<=steps;i++){
      const th=i/steps*Math.PI*2;
      const r=R*(1+0.28*Math.cos(this.nf*th));
      const x=Math.cos(th)*r, y=Math.sin(th)*r;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.closePath(); ctx.stroke();
    ctx.restore();
  });

// N10. SPOTLIGHTS — клубные прожекторы (цвет)

    this.beams=[];
    for(let i=0;i<4;i++) this.beams.push({
      x:(i+0.5)/4, ph:Math.random()*6.3, f:0.0005+Math.random()*0.0004, c:i%6
    });

    const beamLen=H*1.3;
    for(const bm of this.beams){
      const bx=bm.x*W;
      const ang=Math.PI/2+Math.sin(t*bm.f*speed*1.8+bm.ph)*0.55;
      const ex=bx+Math.cos(ang)*beamLen, ey=Math.sin(ang)*beamLen;
      const g=ctx.createLinearGradient(bx,0,bx+(ex-bx)*0.5,ey*0.5);
      const col=NEON[bm.c];

      const hw=W*0.035;
      ctx.beginPath();
      ctx.moveTo(bx-6,0); ctx.lineTo(bx+6,0);
      ctx.lineTo(ex+hw,ey); ctx.lineTo(ex-hw,ey);
      ctx.closePath(); ctx.fill();
      bm.ang=ang; bm.bx=bx;
    }
    ctx.globalAlpha=1;
    // иконки, подсвечиваемые лучами
    for(const o of this.pts){
      const ix=o.x*W, iy=o.y*H;

      for(const bm of this.beams){
        const a2=Math.atan2(iy,ix-bm.bx);

        if (v>lit){ lit=v; litC=bm.c; }
      }
      icon(ctx,o.i,lit>0.25?litC:6,ix,iy,MIN*0.1*(1+p*0.15),0,0.14+lit*0.86);

  });

// N11. ACID PLASMA — контурная «топографическая» плазма с вибрацией под бит
const acid = S('ACID PLASMA',
  function(){
    this.PW=240; this.PH=135;
    this.buf=document.createElement('canvas');
    this.buf.width=this.PW; this.buf.height=this.PH;
    this.bctx=this.buf.getContext('2d');
    this.img=this.bctx.createImageData(this.PW,this.PH);
    this.lastB=-1; this.sa=0;
  },
  function(ctx,t){
    const {PW,PH}=this;
    const d=this.img.data;
    const tt=t*0.0004*speed;
    const p=beatPulse(t);
    const bc=beatCount(t);
    if (bc!==this.lastB){ this.lastB=bc; this.sa=Math.random()*Math.PI*2; }
    const bands=2.6+p*0.18;
    for(let y=0;y<PH;y++){
      for(let x=0;x<PW;x++){
        const wx = x + 26*Math.sin(y*0.045 + tt*1.3);
        const wy = y + 26*Math.sin(x*0.038 - tt);
        const n = Math.sin(wx*0.055 + tt)
                + Math.sin(wy*0.062 - tt*0.8)
                + Math.sin((wx+wy)*0.031 + tt*0.6)
                + Math.sin(Math.hypot(wx-PW/2, wy-PH/2)*0.045 - tt*1.6);
        const s = Math.sin(n*bands);
        const a = s<0?-s:s;
        let r,g,b;
        if (a < 0.11){ r=8; g=2; b=18; }
        else if (s > 0.75){ const k=(s-0.75)/0.25; r=150+k*42; g=28+k*30; b=234+k*16; }
        else if (s > 0.11){ const k=(s-0.11)/0.64; r=22+k*128; g=5+k*23; b=42+k*192; }
        else { const k=(a-0.11)/0.89; r=10+k*22; g=3+k*7; b=24+k*46; }
        const i=(y*PW+x)*4;
        d[i]=r; d[i+1]=g; d[i+2]=b; d[i+3]=255;
      }
    }
    this.bctx.putImageData(this.img,0,0);
    // вибрация под бит: смещение + микро-зум, с запасом по краям
    const amp=MIN*0.012*p;
    const dx=Math.cos(this.sa)*amp, dy=Math.sin(this.sa)*amp;
    const ov=MIN*0.02;
    ctx.imageSmoothingEnabled=true;
    ctx.drawImage(this.buf, -ov+dx, -ov+dy, W+ov*2, H+ov*2);
  });

// 0. 5 STRINGS — пятиструнный эквалайзер.
// Пять полос спектра натянуты между порожком и бриджем. Громкость полосы —
// размах струны и длина шкалы, доминирующая частота — число пучностей: струна
// делится на 1…5 частей и «берёт ноту». Атака в полосе = щипок: вспышка колка
// и искры из пучностей.
const strings5 = S('5 STRINGS',
  function(){
    this.pts = Math.max(60, Math.min(200, Math.round(W/7)));
    this.spark = [];
    this.seen = new Int32Array(NSTR);
    this.ic = [];
    for (let s=0;s<NSTR;s++) this.ic.push(rnd(NICON));
  },
  function(ctx,t,dt){
    ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(0,0,W,H);
    const N=this.pts, gap=H/(NSTR+1);
    const x0=Math.max(MIN*0.09,40), x1=W-Math.max(MIN*0.05,22), span=x1-x0;

    ctx.strokeStyle='rgba(255,255,255,0.16)'; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(x0,gap*0.45); ctx.lineTo(x0,H-gap*0.45);
    ctx.moveTo(x1,gap*0.45); ctx.lineTo(x1,H-gap*0.45);
    ctx.stroke();

    for (let s=0;s<NSTR;s++){
      const y0=gap*(s+1), col=STR_COL[s];
      const lvl=strLvl[s], pl=strPluck[s], w=strPhase[s];
      const mode=1+Math.round(strNote[s]*4);
      const amp=gap*0.46*(0.06+lvl*0.5+pl*0.6);

      if (strHits[s]!==this.seen[s]){
        this.seen[s]=strHits[s];
        for (let k=0;k<mode;k++) this.spark.push({
          x:x0+span*(2*k+1)/(2*mode), y:y0,
          vx:(Math.random()-0.5)*0.32, vy:(Math.random()-0.5)*0.5-0.12,
          a:1, i:rnd(NICON), c:col, s:gap*0.17*(0.5+lvl),
          r:Math.random()*6, vr:(Math.random()-0.5)*0.01
        });
      }

      // шкала полосы — собственно эквалайзер
      ctx.globalAlpha=0.1+lvl*0.14; ctx.fillStyle=NEON[col];
      ctx.fillRect(x0, y0-gap*0.3, span*lvl, gap*0.6);
      ctx.globalAlpha=1;

      // струна: широкий ореол + яркая нить
      ctx.globalCompositeOperation='lighter';
      for (let pass=0;pass<2;pass++){
        ctx.beginPath();
        for (let i=0;i<=N;i++){
          const u=i/N;
          const d=amp*(Math.sin(Math.PI*mode*u)*Math.sin(w)
                     + 0.3*Math.sin(Math.PI*(mode+1)*u)*Math.sin(w*1.6+1.1));
          if (i) ctx.lineTo(x0+span*u, y0+d); else ctx.moveTo(x0+span*u, y0+d);
        }
        ctx.strokeStyle=NEON[col];
        ctx.globalAlpha=pass?0.95:0.2;
        ctx.lineWidth=pass?(1.5+lvl*2.5):(7+lvl*10+pl*8);
        ctx.stroke();
      }
      ctx.globalCompositeOperation='source-over';
      ctx.globalAlpha=1;

      // иконки катаются на пучностях — их столько, сколько нот в полосе
      for (let k=0;k<mode;k++){
        const u=(2*k+1)/(2*mode);
        const d=amp*Math.sin(Math.PI*mode*u)*Math.sin(w);
        icon(ctx,(this.ic[s]+k)%NICON, col, x0+span*u, y0+d,
          gap*0.52*(0.5+lvl*0.45+pl*0.35), d*0.004, 0.7+lvl*0.3);
      }
      // колок слева вспыхивает на щипок
      icon(ctx,(this.ic[s]+s)%NICON, pl>0.35?col:6, x0*0.5, y0,
        gap*0.42*(0.5+pl*0.6), -pl*0.6, 0.35+pl*0.65);
    }

    for (let i=this.spark.length-1;i>=0;i--){
      const o=this.spark[i];
      o.x+=o.vx*dt; o.y+=o.vy*dt; o.vy+=dt*0.0009;
      o.r+=o.vr*dt; o.a-=dt*0.0016;
      if (o.a<=0){ this.spark.splice(i,1); continue; }
      icon(ctx,o.i,o.c,o.x,o.y,o.s*o.a,o.r,o.a);
    }
    if (this.spark.length>160) this.spark.splice(0,this.spark.length-160);
  });
strings5.needsMic = true;

// 0б. BAR EQ — классические столбцы: 5 полос, падающие пиковые шапки, отражение
const barEq = S('BAR EQ',
  function(){
    this.peak=new Float32Array(NSTR); this.vel=new Float32Array(NSTR);
    this.ic=[]; for(let s=0;s<NSTR;s++) this.ic.push(rnd(NICON));
  },
  function(ctx,t,dt){
    ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(0,0,W,H);
    const w=W/NSTR, base=H*0.8, maxh=H*0.68;
    for (let s=0;s<NSTR;s++){
      const col=STR_COL[s], lvl=Math.min(1,strLvl[s]+strPluck[s]*0.35);
      const h=maxh*(0.03+lvl*0.97);
      // шапка догоняет столб мгновенно, а падает с ускорением
      if (h>=this.peak[s]){ this.peak[s]=h; this.vel[s]=0; }
      else { this.vel[s]+=dt*0.006; this.peak[s]=Math.max(h,this.peak[s]-this.vel[s]*dt*0.12); }
      const cx=w*s+w/2, bw=w*0.5;
      ctx.globalCompositeOperation='lighter';
      ctx.fillStyle=NEON[col];
      ctx.globalAlpha=0.8;  ctx.fillRect(cx-bw/2, base-h, bw, h);
      ctx.globalAlpha=0.13; ctx.fillRect(cx-bw*0.85, base-h, bw*1.7, h);   // ореол
      for (let k=0;k<6;k++){                                               // отражение
        ctx.globalAlpha=0.16*(1-k/6);
        ctx.fillRect(cx-bw/2, base+h*0.08*k, bw, h*0.08);
      }
      ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
      ctx.fillStyle='#fff'; ctx.globalAlpha=0.85;
      ctx.fillRect(cx-bw/2, base-this.peak[s]-3, bw, 3);
      ctx.globalAlpha=1;
      icon(ctx,(this.ic[s]+strHits[s])%NICON, col, cx, base-h-w*0.24,
        w*0.32*(0.6+lvl*0.5), strPhase[s]*0.12, 0.75+lvl*0.25);
    }
    ctx.fillStyle='rgba(255,255,255,0.18)'; ctx.fillRect(0,base,W,1);
  });
barEq.needsMic = true;

// 0в. LED EQ — ретро-столбики из сегментов: горит столько ячеек, сколько громкости,
// верхние сегменты уходят в жёлтый и красный, белая ячейка — пик
const ledEq = S('LED EQ',
  function(){ this.seg=12; this.peak=new Float32Array(NSTR); },
  function(ctx,t,dt){
    ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
    const seg=this.seg, w=W/NSTR;
    const cell=Math.min(w*0.7, H*0.82/seg);
    const top=CY-(seg-1)*cell*1.06/2;
    for (let s=0;s<NSTR;s++){
      const lvl=Math.min(1,strLvl[s]+strPluck[s]*0.3);
      const on=Math.round(lvl*seg);
      this.peak[s]=Math.max(on, this.peak[s]-dt*0.0045);
      const pk=Math.floor(this.peak[s]);
      for (let k=0;k<seg;k++){
        const lit=k<on;
        const c = lit ? (k>=seg-2 ? 0 : (k>=seg-4 ? 3 : STR_COL[s])) : 9;
        icon(ctx,(s*2+k)%NICON, (pk===k&&pk>0)?6:c,
          w*s+w/2, top+(seg-1-k)*cell*1.06,
          cell*(lit?0.94:0.72), 0, lit?1:0.13);
      }
    }
  });
ledEq.needsMic = true;

// 0г. RADIAL EQ — пять колец: радиус кольца дышит от громкости полосы,
// число лепестков берётся из ноты — кольцо «звенит» на своей гармонике
const radialEq = S('RADIAL EQ',
  function(){ this.rot=0; },
  function(ctx,t,dt){
    ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(0,0,W,H);
    this.rot += dt*0.00014*speed;
    const NP=170;
    for (let s=0;s<NSTR;s++){
      const col=STR_COL[s], lvl=strLvl[s], pl=strPluck[s];
      const lobes=2+Math.round(strNote[s]*6);
      const dir=(s%2)?-1:1, ph=strPhase[s];
      const r0=MIN*(0.1+s*0.073)*(1+pl*0.07);
      const amp=r0*(0.05+lvl*0.32);
      ctx.beginPath();
      for (let i=0;i<=NP;i++){
        const a=i/NP*Math.PI*2 + this.rot*dir;
        const r=r0+amp*Math.sin(lobes*a+ph);
        const x=CX+Math.cos(a)*r, y=CY+Math.sin(a)*r;
        if (i) ctx.lineTo(x,y); else ctx.moveTo(x,y);
      }
      ctx.closePath();
      ctx.globalCompositeOperation='lighter';
      ctx.strokeStyle=NEON[col];
      ctx.globalAlpha=0.2;  ctx.lineWidth=6+lvl*12+pl*10; ctx.stroke();
      ctx.globalAlpha=0.95; ctx.lineWidth=1.5+lvl*2.5;    ctx.stroke();
      ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
      for (let k=0;k<lobes;k++){                    // иконки сидят на гребнях
        const a=(Math.PI/2 - ph + Math.PI*2*k)/lobes;
        const aa=a+this.rot*dir;
        icon(ctx,(s*3+k)%NICON, col, CX+Math.cos(aa)*(r0+amp), CY+Math.sin(aa)*(r0+amp),
          MIN*0.055*(0.45+lvl*0.6+pl*0.4), aa, 0.55+lvl*0.45);
      }
    }
  });
radialEq.needsMic = true;

// 0д. MIRROR EQ — зеркальная развёртка: полосы копятся стопкой от центра
// и уезжают влево, так что видно последние пару секунд трека
const mirrorEq = S('MIRROR EQ',
  function(){
    this.n=Math.max(48,Math.min(170,Math.round(W/8)));
    this.acc=0;
    this.hist=[];                       // предзаполняем тишиной, чтобы лента шла от края
    for (let i=0;i<this.n;i++) this.hist.push(new Float32Array(NSTR));
  },
  function(ctx,t,dt){
    ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
    this.acc+=dt*speed;
    while (this.acc>26){
      this.acc-=26;
      const f=new Float32Array(NSTR);
      for (let s=0;s<NSTR;s++) f[s]=Math.min(1,strLvl[s]+strPluck[s]*0.4);
      this.hist.push(f);
      if (this.hist.length>this.n) this.hist.shift();
    }
    const n=this.hist.length;
    if (!n) return;
    const step=W/(this.n-1), unit=H*0.4/NSTR;
    // рисуем от верхнего слоя к нижнему — младшие полосы просто закрашивают старших
    for (let s=NSTR-1;s>=0;s--){
      const cum=i=>{ let v=0; for(let j=0;j<=s;j++) v+=this.hist[i][j]; return unit*(0.12+v); };
      for (let dir=-1;dir<=1;dir+=2){
        ctx.beginPath();
        ctx.moveTo(W-(n-1)*step, CY);
        for (let i=0;i<n;i++) ctx.lineTo(W-(n-1-i)*step, CY+dir*cum(i));
        ctx.lineTo(W, CY);
        ctx.closePath();
        ctx.fillStyle=NEON[STR_COL[s]];
        ctx.globalAlpha=dir<0?0.85:0.5;
        ctx.fill();
      }
    }
    ctx.globalAlpha=1;
    // текущий срез справа — иконки на границах слоёв
    let v=0;
    for (let s=0;s<NSTR;s++){
      v+=this.hist[n-1][s];
      const y=CY-unit*(0.12+v);
      icon(ctx,(s*4)%NICON, STR_COL[s], W-MIN*0.05, y,
        MIN*0.07*(0.5+strLvl[s]*0.6+strPluck[s]*0.4), 0, 0.7+strLvl[s]*0.3);
    }
    ctx.fillStyle='rgba(255,255,255,0.14)'; ctx.fillRect(0,CY,W,1);
  });
mirrorEq.needsMic = true;

const scenes = [strings5, barEq, ledEq, radialEq, mirrorEq,
  mega, warp, kaleido, acid, plasma, grid, zoomT, floor, plasmaBW,
  matrix, rings, strobe, fireworks,
  pendulum, lissa, radar, ripple, horizon, rotor, ink, moire, poly, spot];

scenes.forEach(s=>{


// Приложение: канвасы сцен, resize, переключение с кроссфейдом,
// ввод (клавиши и жесты), панель синхрона с YouTube, wake lock, главный цикл.
  s.canvas=document.createElement('canvas');
  s.ctx=s.canvas.getContext('2d');
});

let vignette=null;
function buildVignette(){
  vignette=document.createElement('canvas');
  vignette.width=W; vignette.height=H;
  const v=vignette.getContext('2d');
  const g=v.createRadialGradient(CX,CY,MIN*0.35,CX,CY,Math.hypot(CX,CY));
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(0,0,0,0.3)');
  v.fillStyle=g; v.fillRect(0,0,W,H);
}
function resize(){
  W=main.width=innerWidth; H=main.height=innerHeight;
  CX=W/2; CY=H/2; MIN=Math.min(W,H);
  mctx.imageSmoothingQuality='high';
  scenes.forEach(s=>{ s.canvas.width=W; s.canvas.height=H; s.ctx.imageSmoothingQuality='high'; s.init(); });
  buildVignette();
}
addEventListener('resize', resize);
resize();

function setScene(i){
  const next=((i%scenes.length)+scenes.length)%scenes.length;
  if (next===sceneIdx) return;
  prevIdx=sceneIdx; sceneIdx=next;
  transStart=performance.now();
  scenes[sceneIdx].init();
  let msg=(sceneIdx+1)+' / '+scenes.length+' · '+scenes[sceneIdx].name;
  if (scenes[sceneIdx].needsMic && !micOn) msg+=' · включи 🎤 (M / 3 пальца)';
  flashMsg(msg);
}

// ---------- input ----------
addEventListener('keydown', e=>{
  if (e.code.startsWith('Digit')){
    let n=parseInt(e.code.slice(5));
    n = n===0 ? 10 : n;
    if (e.shiftKey) n+=10;       // Shift+1..0 = сцены 11-20
    setScene(n-1);
    return;
  }
  switch(e.code){
    case 'Space': case 'ArrowRight': setScene(sceneIdx+1); e.preventDefault(); break;
    case 'ArrowLeft': setScene(sceneIdx-1); break;
    case 'KeyT': tap(); break;
    case 'KeyY': toggleSync(); break;
    case 'KeyV': if (syncOpen) videoTap(); break;
    case 'KeyM': micOn?stopMic():startMic(); break;
    case 'ArrowUp': speed=Math.min(3,speed+0.2); flashMsg('SPEED '+speed.toFixed(1)); break;
    case 'ArrowDown': speed=Math.max(0.2,speed-0.2); flashMsg('SPEED '+speed.toFixed(1)); break;
    case 'KeyF':
      document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
      break;
  }
});

let tsX=0,tsY=0,tsT=0,tsN=0;
addEventListener('touchstart', e=>{
  tsN=Math.max(tsN,e.touches.length);
  const t0=e.touches[0];
  tsX=t0.clientX; tsY=t0.clientY; tsT=performance.now();
},{passive:true});
addEventListener('touchend', e=>{
  if (e.touches.length>0) return;
  const n=tsN; tsN=0;
  if (n>=4){ toggleSync(); return; }
  if (n===3){ micOn?stopMic():startMic(); return; }
  if (n===2){ tap(); return; }
  const t0=e.changedTouches[0];
  const dx=t0.clientX-tsX, dy=t0.clientY-tsY;
  const dt=performance.now()-tsT;
  const adx=Math.abs(dx), ady=Math.abs(dy);
  if (adx<20 && ady<20 && dt<350){
    if (syncOpen) videoTap(); else setScene(sceneIdx+1);
  }
  else if (adx>ady && adx>50){ setScene(sceneIdx+(dx<0?1:-1)); }
  else if (ady>50){
    speed = dy<0?Math.min(3,speed+0.4):Math.max(0.2,speed-0.4);
    flashMsg('SPEED '+speed.toFixed(1));
  }
},{passive:true});
addEventListener('click', ()=>{ if (syncOpen) videoTap(); else setScene(sceneIdx+1); });

// ---------- синхрон видеоряда с YouTube ----------
// Скорость YouTube меняет темп видео линейно: BPM_эфф = BPM_видео × скорость.
// Нужно BPM_эфф ≈ BPM_трека (или кратно вдвое — глазом это тот же ритм).
// Отсюда: скорость = BPM_трека / BPM_видео, свёрнутая в диапазон 0.25…2
// умножением/делением на 2, и округлённая до ближайшего шага YouTube.
const YT = [0.25,0.5,0.75,1,1.25,1.5,1.75,2];
const syncEl = document.getElementById('sync');
let syncOpen=false, videoTaps=[], videoBpm=0, syncStamp=0;

function ytSync(track, video){
  let ideal = track/video;
  while (ideal > 2) ideal /= 2;
  while (ideal < 0.25) ideal *= 2;
  const opts = YT.map(s=>{
    const eff = video*s;
    const e = Math.log2(eff/track);
    const k = Math.round(e);
    const dev = Math.pow(2, e-k) - 1;        // относительное отклонение
    const dB = Math.abs(eff - track*Math.pow(2,k));
    return { s, eff, dev, k, drift: dB>0.02 ? 30/dB : Infinity };
  // при равной точности выигрывает скорость, ближняя к 1× —
  // видео не превращается ни в слайд-шоу, ни в мельтешение
  }).sort((a,b)=>(Math.abs(a.dev)+0.012*Math.abs(Math.log2(a.s)))
               - (Math.abs(b.dev)+0.012*Math.abs(Math.log2(b.s))));
  return { ideal, opts };
}

function videoTap(){
  const now=performance.now();
  videoTaps=videoTaps.filter(x=>now-x<3000);
  videoTaps.push(now);
  if (videoTaps.length>=3){
    const iv=[];
    for(let i=1;i<videoTaps.length;i++) iv.push(videoTaps[i]-videoTaps[i-1]);
    iv.sort((a,b)=>a-b);
    videoBpm = Math.round(60000/iv[Math.floor(iv.length/2)]);
  }
  drawSync();
}

function drawSync(){
  if (!syncOpen) return;
  let s = 'СИНХРОН ВИДЕО С ТРЕКОМ\n';
  s += '───────────────────────────────\n';
  s += 'Трек   ' + bpm + ' BPM' + (micOn?'  (микрофон)':'  (tap tempo)') + '\n';
  if (videoBpm){
    s += 'Видео  ' + videoBpm + ' BPM  (' + videoTaps.length + ' тапов)\n\n';
    const { ideal, opts } = ytSync(bpm, videoBpm);
    s += 'идеально ×' + ideal.toFixed(2) + ' — ближайшие на YouTube:\n\n';
    for (let i=0;i<3;i++){
      const o=opts[i];
      const dev=(o.dev*100);
      const sign=dev>=0?'+':'';
      const drift = o.drift===Infinity ? 'не разъедется'
        : (o.drift>=60 ? 'разъедется ~'+Math.round(o.drift/60)+' мин'
                       : 'разъедется ~'+Math.round(o.drift)+' с');
      const mult = o.k===0 ? '' : (o.k>0 ? '  ×2 темп' : '  ½ темп');
      s += (i===0?'▸ ':'  ') + '×'+o.s.toFixed(2) + '  →  ' +
           Math.round(o.eff) + ' BPM   ' + sign + dev.toFixed(1) + '%   ' + drift + mult + '\n';
    }
    s += '\nТочность до 1% держится всю песню,\nбольше 3% — лучше взять другое видео.';
  } else {
    s += 'Видео  —\n\nТапай по экрану в темп видео\n(нужно 3 тапа и больше)\n';
    s += '\nФормула:\n  скорость = BPM трека / BPM видео\n';
    s += '  результат ×2 или /2 до диапазона 0.25…2\n';
    s += '  и округлить до шага YouTube (0.25)';
  }
  s += '\n───────────────────────────────\n';
  s += '4 пальца — закрыть · 2 пальца — темп трека';
  syncEl.textContent = s;
}

function toggleSync(){
  syncOpen=!syncOpen;
  syncEl.classList.toggle('show', syncOpen);
  if (syncOpen){ videoTaps=[]; videoBpm=0; drawSync(); }
}

// ---------- wake lock ----------
window.addEventListener('error', e=>{
  flash.textContent='ОШИБКА: '+(e.message||'script error');
  flash.classList.add('show');
  clearTimeout(flashTimeout);
});
setTimeout(()=>{
  if (!ready){
    flash.textContent='Спрайты не загрузились — обнови страницу';
    flash.classList.add('show');
  }
}, 4000);

let wakeLock=null;
async function requestWakeLock(){
  if (!('wakeLock' in navigator)) return;
  try {
    if (wakeLock && !wakeLock.released) return;
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', ()=>{ wakeLock=null; });
  } catch(e){}
}
requestWakeLock();
['click','touchend','keydown'].forEach(ev=>addEventListener(ev,requestWakeLock,{passive:true}));
document.addEventListener('visibilitychange', ()=>{
  if (document.visibilityState==='visible') requestWakeLock();
});

// ---------- loop ----------
let prev=performance.now();
function loop(t){
  const dt=Math.min(50,t-prev); prev=t;
  if (!ready){
    mctx.fillStyle='#000'; mctx.fillRect(0,0,W,H);
    mctx.fillStyle='#fff'; mctx.font='16px monospace'; mctx.textAlign='center';
    mctx.fillText('LOADING...',CX,CY);
    requestAnimationFrame(loop); return;
  }
  micAnalyse(t);
  stringsAnalyse(t,dt);
  const cur=scenes[sceneIdx];
  try { cur.draw(cur.ctx,t,dt); } catch(err){ console.error(cur.name, err); }
  const inTrans = transStart>0 && t-transStart<TRANS_MS && prevIdx>=0;
  if (inTrans){
    const pr=scenes[prevIdx];
    try { pr.draw(pr.ctx,t,dt); } catch(err){ console.error(pr.name, err); }
    const k=(t-transStart)/TRANS_MS;
    const ease=k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    mctx.globalAlpha=1; mctx.drawImage(pr.canvas,0,0);
    mctx.globalAlpha=ease; mctx.drawImage(cur.canvas,0,0);
    mctx.globalAlpha=1;
  } else {
    if (transStart>0){ transStart=-1; prevIdx=-1; }
    mctx.drawImage(cur.canvas,0,0);
  }
  if (vignette) mctx.drawImage(vignette,0,0);
  if (syncOpen && t-syncStamp>500){ syncStamp=t; drawSync(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

const standalone = window.navigator.standalone === true ||
  (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
flashMsg('1 / '+scenes.length+' · 5 STRINGS — тап: сцена · 2 пальца: темп · 3: 🎤 · 4: синхрон видео');
if (isIOS && !standalone){
  setTimeout(()=>flashMsg('Поделиться → На экран «Домой» — тогда будет весь экран'), 6000);
}

})();
</script>
